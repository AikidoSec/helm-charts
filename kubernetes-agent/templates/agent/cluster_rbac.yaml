apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubernetes-agent.fullname" . }}
rules:
  # Core ("" group)
  - apiGroups: [""]
    resources:
      - pods
      - endpoints
      - services
      - namespaces
      - nodes
      - serviceaccounts
      - configmaps
      - persistentvolumes
      - persistentvolumeclaims
    verbs: ["get","list","watch"]
  # apps
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs: ["get","list","watch"]
  # rbac.authorization.k8s.io
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get","list","watch"]
  # networking.k8s.io
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingresses
      - ingressclasses
    verbs: ["get","list","watch"]
  # batch
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get","list","watch"]
  # storage.k8s.io
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get","list","watch"]
  # discovery.k8s.io
  - apiGroups: [ "discovery.k8s.io" ]
    resources:
      - endpointslices
    verbs: [ "get","list","watch" ]
  # operator.openshift.io
  - apiGroups: [ "operator.openshift.io" ]
    resources:
      - imagecontentsourcepolicies
      - ingresscontrollers
    verbs: [ "get","list","watch" ]
  # config.openshift.io
  - apiGroups: [ "config.openshift.io" ]
    resources:
      - imagedigestmirrorsets
      - imagetagmirrorsets
    verbs: [ "get","list","watch" ]
  # route.openshift.io
  # A Route embeds its certificate and private key inline in
  # spec.tls. The agent clears those fields before sending the object, so no key
  # material ever leaves the cluster:
  # https://github.com/AikidoSec/kubernetes-agent/blob/7a5440d5ae07af2a60000f8d9780f233a283e743/internal/format/route.go#L12
  - apiGroups: [ "route.openshift.io" ]
    resources:
      - routes
    verbs: [ "get","list","watch" ]
  # traefik.io
  - apiGroups: [ "traefik.io" ]
    resources:
      - ingressroutes
    verbs: [ "get","list","watch" ]
  # gateway.networking.k8s.io
  - apiGroups: [ "gateway.networking.k8s.io" ]
    resources:
      - gateways
      - httproutes
    verbs: [ "get","list","watch" ]
  # configuration.konghq.com
  - apiGroups: [ "configuration.konghq.com" ]
    resources:
      - kongroutes
      - kongservices
    verbs: [ "get","list","watch" ]
  # keda.sh
  - apiGroups: [ "keda.sh" ]
    resources:
      - scaledjobs
      - scaledobjects
    verbs: [ "get","list","watch" ]
  # argoproj.io
  - apiGroups: [ "argoproj.io" ]
    resources:
      - applications
      - rollouts
    verbs: [ "get","list","watch" ]
  # autoscalers
  - apiGroups: [ "autoscaling" ]
    resources:
      - horizontalpodautoscalers
    verbs: [ "get","list","watch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubernetes-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubernetes-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "kubernetes-agent.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
