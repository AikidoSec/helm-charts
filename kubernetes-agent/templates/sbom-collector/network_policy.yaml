{{- if and .Values.networkPolicy.enabled .Values.sbomCollector.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sbom-collector.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      aikido-security: kubernetes-sbom-collector
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress: []
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              aikido-security: kubernetes-agent
      ports:
        - protocol: TCP
          port: {{ .Values.agent.service.port }}
    {{- range .Values.networkPolicy.egress.rules }}
    {{- toYaml (list .) | nindent 4 }}
    {{- end }}
    {{- range .Values.networkPolicy.egress.extra }}
    {{- toYaml (list .) | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
